<!DOCTYPE html>
<html lang="ne">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>कृषिमित्र (KrishiMitra) - Smart Cardamom Farming Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style id="expo-reset">
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-color: #e2ece4;
        font-family: 'Mukta', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow-y: auto !important;
        -webkit-overflow-scrolling: touch;
      }
      #root {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      /* Custom smooth scrollbar for desktop preview */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #e2ece4;
      }
      ::-webkit-scrollbar-thumb {
        background: #a5d6a7;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #81c784;
      }
    </style>
  </head>
  <body>
    <noscript>Please enable JavaScript to run KrishiMitra.</noscript>
    <div id="root"></div>
  </body>
</html>
